[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-permit"
version = "0.1.0"
description = "Default-deny authorization for AI agent tool calls"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Siddharth Tanwar"}]
dependencies = []

[project.scripts]
agent-permit = "agent_permit.__main__:main"

[tool.setuptools.packages.find]
include = ["agent_permit*"]
